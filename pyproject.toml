[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchlab"
version = "0.1.0"
description = "Automated tactical analysis and pitch calibration pipeline for football broadcast highlights"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PitchLab Engineering Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "shapely>=2.0.0",
    "opencv-python-headless>=4.8.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "supervision>=0.19.0",
    "scenedetect[opencv]>=0.6.2",
    "kloppy>=3.12.0",
    "mplsoccer>=1.2.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "fsspec>=2024.1.0",
    "gcsfs>=2024.1.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-firestore>=2.15.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "ultralytics>=8.0.0",
    "typer>=0.9.0",
    "scikit-image>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
pitchlab = "pitchlab.cli:main"

[tool.setuptools.packages.find]
include = ["pitchlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
