version: "1.0"

m6:
  yolo:
    weights: "yolov8x.pt"
    conf_thresh: 0.25
    iou_thresh: 0.45
    imgsz: 1280
    device: "cuda"

  sahi:
    enabled: false
    slice_height: 640
    slice_width: 640
    overlap_height_ratio: 0.2
    overlap_width_ratio: 0.2

  bytetrack:
    track_thresh: 0.5
    track_buffer: 30
    match_thresh: 0.8
    frame_rate: 25

  kalman_ball:
    process_noise: 1.0
    measurement_noise: 10.0
    max_dist_px: 150.0
    max_missing_frames: 5
